<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card de Carro</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background: #f2f4f7;
    padding: 30px;
}
/* CARD */
.car-card {
    width: 360px;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    transition: 0.3s;
}
.car-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.18);
}
/* FOTO */
.car-image {
    position: relative;
    width: 100%;
    height: 230px;
    overflow: hidden;
}
.car-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
}
.car-card:hover .car-image img {
    transform: scale(1.06);
}
/* ETIQUETA */
.badge {
    position: absolute;
    top: 15px;
    left: 15px;
    background: #111;
    color: white;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}
/* FAVORITO */
.favorite {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
}
/* CONTEÚDO */
.car-content {
    padding: 20px;
}
.car-brand {
    color: #777;
    font-size: 13px;
    margin-bottom: 5px;
}
.car-title {
    font-size: 22px;
    font-weight: bold;
    color: #111;
    margin-bottom: 12px;
}
.car-info {
    display: flex;
    gap: 15px;
    color: #555;
    font-size: 13px;
    margin-bottom: 18px;
}
.car-price {
    font-size: 25px;
    font-weight: bold;
    color: #111;
    margin-bottom: 15px;
}
/* BOTÃO */
.btn {
    display: block;
    width: 100%;
    padding: 13px;
    text-align: center;
    text-decoration: none;
    background: #111;
    color: white;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s;
}
.btn:hover {
    background: #333;
}
</style>
</head>
<body>
<div class="car-card">
    <!-- FOTO DO CARRO -->
    <div class="car-image">
        <img 
        src="https://images.unsplash.com/photo-1503376780353-7e6692767b70"
        alt="PRISMA">
        <span class="badge">LEONARDO</span>
        <div class="favorite">
            ♡
        </div>
    </div>
    <!-- INFORMAÇÕES -->
    <div class="car-content">
        <div class="car-brand">
            Chevrolet prisma
        </div>
        <div class="car-title">
            Chevrolet Prisma
        </div>
        <div class="car-info">
            <span>🚗 0000</span>
            <span>⚙️ manual</span>
            <span>⛽ Flex</span>
        </div>
        <div class="car-price">
        
        
</div>
</body>
</html>
