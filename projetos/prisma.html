<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card de Carro</title>
<style>

body {
    margin-bottom: 0;
   
}
.car-gallery {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-bottom: 10px;
}

.car-image {
    flex: 1;
    height: 100cqh;
    width: 100%;
    overflow: hidden;
    margin-bottom: 0px;
    border-radius: 10px;
    
    

}

.car-image img {
    width: 100%;
    height: 80%;
    object-fit: cover;
    margin-bottom: 0px;
    box-shadow: 14px 14px 14px black;
    
}


</style>
</head>
<body>
<div class="car-card">
    <!-- FOTO DO CARRO -->

    <article class="car-gallery">

    <div class="car-image">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="PRISMA">
        
        <p>PLACA: 0000 <BR>
           MODELO: Chevrolet PRISMA 1.4 MPFI LT 8V FLEX 4P <BR>
           MOTORISTA: LEONARDO 
        </p>
    </div>

    <div class="car-image">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="PRISMA">
        
    </div>

    <div class="car-image">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="PRISMA">
        
    </div>

    <div class="car-image">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="PRISMA">
        
    </div>

</div>

</body>
</html>
