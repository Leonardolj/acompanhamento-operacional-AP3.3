<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Instalação - CAP 33</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
      padding: 30px;
    }

    .dashboard {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      background: linear-gradient(135deg, #0b3d91, #1769d1);
      color: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      opacity: .9;
      font-size: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      border-left: 5px solid #1769d1;
    }

    .card .label {
      color: #687386;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .card .value {
      font-size: 27px;
      font-weight: bold;
      color: #0b3d91;
    }

    .main-card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .main-card h2 {
      margin-bottom: 25px;
      color: #172033;
    }

    .valor-principal {
      text-align: center;
      padding: 35px;
      border-radius: 15px;
      background: #eef5ff;
    }

    .valor-principal span {
      display: block;
      color: #5d6878;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .valor-principal strong {
      font-size: 48px;
      color: #0b3d91;
    }

    .barra-container {
      margin-top: 30px;
    }

    .barra-titulo {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .barra {
      height: 18px;
      background: #e2e7ef;
      border-radius: 20px;
      overflow: hidden;
    }

    .barra-progresso {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0b3d91, #f5f6f6);
      border-radius: 20px;
    }

    .footer {
      text-align: center;
      color: #7b8492;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .valor-principal strong {
        font-size: 34px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <div class="header">
      <h1>Dashboard de Instalação</h1>
      <p>Indicador de valor de instalação — AGOSTO</p>
    </div>

    <div class="cards">

      <div class="card">
        <div class="label">MÊS</div>
        <div class="value">AGOSTO</div>
      </div>

      <div class="card">
        <div class="label">UNIDADE</div>
        <div class="value">HERCULANO PINHEIRO</div>
      </div>

      <div class="card">
        <div class="label">VALOR TOTAL</div>
        <div class="value">R$ 13.590,00</div>
      </div>

    </div>

    <div class="main-card">

      <h2>Valor de Instalação — AGOSTO</h2>

      <div class="valor-principal">
        <span>Valor total da instalação</span>
        <strong>R$ 13.590,00</strong>
      </div>

      <div class="barra-container">

        <div class="barra-titulo">
          <span>HERCULANO PINHEIRO</span>
          <span>40%</span>
        </div>

        <div class="barra">
          <div class="barra-progresso"></div>
        </div>

      </div>

    </div>

    <div class="footer">
      Indicador de instalação • AGOSTO • HERCULANO PINHEIRO
    </div>

  </div>

</body>
</html>
